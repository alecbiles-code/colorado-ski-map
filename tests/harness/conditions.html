<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conditions harness</title>
<!-- Resolve every relative URL from the site root, as index.html does. -->
<base href="../../">
<link rel="stylesheet" href="./app/ui/app.css">
<link rel="stylesheet" href="./app/ui/conditions.css">
<style>
  html, body { overflow: auto; height: auto; }
  body { padding: 12px 16px 40px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .summary-demo { margin-bottom: 12px; }
</style>
</head>
<body>
<!--
  Test harness for app/ui/conditions.js. Query parameters:
  caic=on      switch the CAIC adapter on for this page only (the app default stays off)
  route=1      pass a route line from Berthoud Pass past Jones Pass toward Loveland Pass
  station=335  open via showStation with that SNOTEL station
  fail=nws,openmeteo,awdb,caic  make requests to those hosts fail (failure-state screenshots)
-->
<div class="bar">
  <button type="button" class="btn" id="units">Switch units</button>
  <span id="unitsLabel" class="muted"></span>
</div>
<div class="card summary-demo"><h4>Place card summary</h4><div id="summary"></div></div>
<div id="host"></div>
<script type="module">
import {CONFIG} from './app/config.js';
import {getUnits, setUnits} from './app/lib/units.js';
import {createConditionsView, renderPlaceSummary} from './app/ui/conditions.js';

const q = new URLSearchParams(location.search);
if (q.get('caic') === 'on') CONFIG.providers.caic.enabled = true;
const HOSTS = {nws: 'api.weather.gov', openmeteo: 'api.open-meteo.com', awdb: 'wcc.sc.egov.usda.gov', caic: 'api.avalanche.org'};
const fail = (q.get('fail') || '').split(',').map(k => HOSTS[k]).filter(Boolean);
const realFetch = window.fetch.bind(window);
window.fetch = async (url, init) => {
  const u = String(url);
  if (fail.some(h => u.includes(h))) throw new TypeError('Failed to fetch (harness)');
  return realFetch(url, init);
};

const berthoud = {lon: -105.7772, lat: 39.7983, name: 'Berthoud Pass', elevationM: 3446};
if (q.get('route')) berthoud.line = {type: 'LineString', coordinates: [[-105.7772, 39.7983], [-105.8913, 39.7742], [-105.879, 39.6634], [-106.0, 39.5]]};
const view = createConditionsView(document.getElementById('host'));
if (q.get('station')) {
  view.showStation({type: 'Feature', geometry: {type: 'Point', coordinates: [-105.77786, 39.80364]},
    properties: {upstreamId: `${q.get('station')}:CO:SNTL`, name: 'Berthoud Summit', elevationM: 3444.2, dataTimeZoneOffsetHours: -8}});
} else view.show(berthoud);
renderPlaceSummary(document.getElementById('summary'), berthoud);
const label = () => { document.getElementById('unitsLabel').textContent = `Units: ${getUnits()}`; };
document.getElementById('units').addEventListener('click', () => { setUnits(getUnits() === 'metric' ? 'imperial' : 'metric'); label(); });
label();
window.__view = view;
</script>
</body>
</html>
