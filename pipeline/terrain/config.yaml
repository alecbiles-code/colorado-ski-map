# Analysis grids. All are EPSG:26913 (NAD83 / UTM 13N), 10 m cells, edges on multiples of 10 m.
regions:
  pilot:
    crs: EPSG:26913
    res_m: 10
    bounds: [414110, 4381320, 447020, 4419360]  # xmin, ymin, xmax, ymax (contract, docs/ARCHITECTURE.md 3.4)
    tiles: [n40w106, n40w107]
  n40w107:                  # 1x1 degree proof cell: UTM rectangle enclosing the cell, snapped outward to 10 m
    crs: EPSG:26913
    res_m: 10
    bounds: [326800, 4317250, 414640, 4429680]
    cell: [-107, 39, -106, 40]          # west, south, east, north; display drawn only inside
    display_max_zoom: 14                # z10-z15 measured 33.7 MB (over 25 MB); z10-z14 fits in one file
    tiles: [n39w106, n39w107, n39w108, n40w106, n40w107, n40w108, n41w106, n41w107, n41w108]
  # Statewide mountain cells (lead decision 2026-11-06): display z10-z14 for all; numeric for n40w106 only.
  n38w105:
    crs: EPSG:26913
    res_m: 10
    bounds: [499990, 4094870, 588980, 4206290]
