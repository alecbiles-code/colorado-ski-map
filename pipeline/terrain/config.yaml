processing:
  buffer_cells: 16          # extra cells on every side; computed then cropped so edge cells are valid
  resampling: bilinear      # 3DEP geographic -> analysis grid
  nodata_out: -9999.0
  dem_scale: 10             # DEM is quantized to round(z * dem_scale) / dem_scale (0.1 m) BEFORE slope/aspect,
                            # so the browser can rebuild identical slope/aspect from the numeric tiles
  flat_threshold_deg: 1.0   # slope below this: aspect = -1 (flat)
  strip_rows: 1024          # slope/aspect computed in row strips (memory bound for 1x1 degree cells)
  geo_margin_deg: 0.002     # extra source margin around the buffered grid footprint

# Display tiles: classified slope, Web Mercator 256 px PNG (palette), nearest-neighbour from the
# analysis grid, slopes under 25 degrees and no data transparent, empty tiles omitted.
display:
  min_zoom: 10
  max_zoom: 15
  tile_size: 256

# Numeric inspection tiles (docs/methods/terrain.md section 7). NOT Web Mercator: tile (x, y) at
# zoom tile_z is the block of block_cells x block_cells analysis cells whose top-left corner is
# (origin_e + x * block_cells * res, origin_n - y * block_cells * res) in EPSG:26913.
numeric:
  utm_zone: 13
  origin_e: 0
  origin_n: 4700000
  block_cells: 256
  apron_cells: 1            # one extra cell on every side so a single tile holds every 3x3 window
  tile_z: 9                 # PMTiles key space only (x, y < 512 covers Colorado)
  nodata: -1000000          # integer code for no data
  zlib_level: 9
  split_deg: 0.5            # 1x1 degree cells are written as four 0.5 degree archives (25 MB file limit)

# Tier 1 comparison (tier1_compare.py): Terrarium tiles per provider, slope computed with
# app/lib/terrain-math.js. Mapterhorn is the contract provider, AWS Terrain Tiles the fallback.
tier1:
  user_agent: skintrack-co-terrain-pipeline/0.1 (personal non-commercial research)
  margin_tiles: 1           # extra ring of tiles so mosaic edges never touch the pilot
  workers: 4
  providers:
    mapterhorn:
      url_template: https://tiles.mapterhorn.com/{z}/{x}/{y}.webp
      terms: https://mapterhorn.com/attribution/
      attribution: "© Mapterhorn"
      tile_size: 512
      zooms: [12, 13, 14]
    aws:
      url_template: https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png
      terms: https://raw.githubusercontent.com/tilezen/joerd/master/docs/attribution.md
      attribution: 3DEP (formerly NED) terrain data courtesy of the U.S. Geological Survey
      tile_size: 256
      zooms: [12, 13, 14]
  # Source-vintage check (tier1_vintage.py): older 3DEP releases of one tile over a sub-area.
  vintage:
    utm_box: [425000, 4390000, 440000, 4410000]   # xmin, ymin, xmax, ymax inside the pilot
    versions:
      "2011-06-01": https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/historical/n40w106/USGS_13_n40w106_20110601.tif
      "2022-02-16": https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/historical/n40w106/USGS_13_n40w106_20220216.tif

verify:
  points: 1000              # random points checked against the source rasters
  seed: 20261106

# Statewide cost estimate (estimate_statewide.py). Mountain cells: 1x1 degree 3DEP cells, named by NW
# corner, covering the Colorado ranges with ski terrain (San Juans, Sangre de Cristo, Spanish Peaks,
# Sawatch, Elk, Gore, Tenmile, Mosquito, Front Range, Park, Never Summer, Flat Tops edge).
statewide:
  cells: [n38w105, n38w106, n38w107, n38w108, n38w109, n39w106, n39w107, n39w108,
          n40w106, n40w107, n40w108, n41w106, n41w107, n41w108]
  measured: [pilot, n40w107]  # regions whose measured rates drive the estimate
  candidate_max_zooms: [13, 14, 15]
  pages_site_limit_bytes: 1000000000   # "Published GitHub Pages sites may be no larger than 1 GB"
  file_limit_bytes: 25000000           # project rule: every committed file at most 25 MB
  tile_bytes_typical: 420000000        # 3DEP 1/3 arc-second 1x1 degree COG, n40w106/n40w107 measured

# Slope classes, degrees, lower bound inclusive (contract 3.3). Colors run yellow -> purple with CIELAB
# L* 84.9, 72.2, 60.1, 44.3, 21.9 (adjacent steps >= 12), so classes stay ordered and distinguishable
# by lightness alone for every color-vision type (checked in tests/pipeline/test_terrain_core.py).
slope_classes:
  - {id: lt25,  min: 0,  max: 25,   label: "<25",   color: null}
  - {id: s25,   min: 25, max: 30,   label: "25-30", color: "#F7D13D"}
  - {id: s30,   min: 30, max: 35,   label: "30-35", color: "#FB9B06"}
  - {id: s35,   min: 35, max: 40,   label: "35-40", color: "#ED6925"}
  - {id: s40,   min: 40, max: 45,   label: "40-45", color: "#BC3754"}
  - {id: s45,   min: 45, max: null, label: ">=45",  color: "#56106E"}
