# Snow pipeline configuration. Paths are relative to the repository root.
# Researched and tested 2026-11-05/06 UTC; see docs/methods/snow-sar-incidents.md.

http:
  user_agent: "skintrack-co-pipeline/0.1 (personal, non-commercial)"
  timeout_s: 120
  retries: 3
  retry_wait_s: 15

snotel:
  api_base: "https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1"
  station_page: "https://wcc.sc.egov.usda.gov/nwcc/site?sitenum={station_id}"
  # SNTL = SNOTEL (snow depth, SWE, precipitation, temperature).
  # SNTLT = SNOLITE (snow depth and temperature only, no SWE); four high stations in the Taylor Park area.
  station_triplets: ["*:CO:SNTL", "*:CO:SNTLT"]
  network_names: {SNTL: "SNOTEL", SNTLT: "SNOLITE"}
  # Station elements reported in the snapshot (ordinal 1 only; soil, battery and diagnostics omitted).
  elements: [SNWD, WTEQ, PREC, PRCPSA, TOBS, TMAX, TMIN, TAVG, SNDN, RHUM, WSPDV, WSPDX, WDIRV, SWINV]
  durations: [DAILY, HOURLY]
  feet_to_m: 0.3048
  out_geojson: "data/snow/snotel-stations.geojson"
  out_meta: "data/snow/snotel-stations.meta.json"

snodas:
  # NSIDC G02158 v1, masked (contiguous US) daily archive. Public HTTPS, no login.
  base_url: "https://noaadata.apps.nsidc.org/NOAA/G02158/masked"
  landing_page: "https://nsidc.org/data/g02158/versions/1"
  user_guide: "https://nsidc.org/sites/default/files/g02158-v001-userguide_2_1.pdf"
  max_lookback_days: 10
  # Masked grid, files from 2013-10-01 onward (user guide table 6 and section 1.7.4).
  grid: {cols: 6935, rows: 3351, cells_per_degree: 120, nodata: -9999, saturated: 32767}
  # Colorado is -109.06 to -102.04 E, 36.99 to 41.00 N; about 0.25 degree buffer, snapped to the grid.
  bbox: {west: -109.3, east: -101.8, south: 36.75, north: 41.25}
  png_pixels_per_cell_x: 2
  chunk_cells: 64
  out_dir: "data/snow/snodas"
  out_meta: "data/snow/snodas.meta.json"
  keep_dates: 2
  variables:
    # Integer in file / scale_divisor = metres (user guide table 1). Stored unscaled, so 1 unit = 1 mm.
    snow_depth:
      member_key: "ssmv11036tS__T0001"
      expected_units: "Meters / 1000.000000"
      scale_divisor: 1000
      png: "snow-depth.png"
      # Upper bounds in mm of depth, lower bound exclusive; last class is open-ended.
      classes_mm: [50, 150, 300, 500, 750, 1000, 1500, 2000, 3000]
      colors: ["#dbe9f6", "#bad6eb", "#89bedc", "#539ecd", "#2b7bba", "#0b559f", "#08306b", "#2d1e6b", "#54278f", "#7a0177"]
    swe:
      member_key: "ssmv11034tS__T0001"
      expected_units: "Meters / 1000.000000"
      scale_divisor: 1000
      png: "swe.png"
      classes_mm: [10, 25, 50, 100, 200, 300, 500, 750, 1000]
      colors: ["#e0f3f0", "#c2e6df", "#94d3c7", "#5fbcab", "#35a08f", "#1b7f73", "#0d5f58", "#08433f", "#14325c", "#2a1a5e"]
  nodata_rgba: [128, 128, 128, 140]
