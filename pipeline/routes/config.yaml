  - [-105.777, 39.798, front-range]     # Berthoud Pass
  - [-105.879, 39.663, front-range]     # Loveland Pass
  - [-105.900, 39.670, front-range]     # Loveland ski area (east of the divide)
  - [-105.872, 39.642, summit-tenmile]  # Arapahoe Basin base
  - [-105.643, 39.588, front-range]     # Mount Evans
  - [-106.106, 39.397, summit-tenmile]  # Quandary Peak
  - [-106.217, 39.530, summit-tenmile]  # Vail Pass
  - [-106.481, 39.467, vail-eagle-gore] # Mount of the Holy Cross
  - [-106.445, 39.118, sawatch]         # Mount Elbert
  - [-106.564, 39.108, sawatch]         # Independence Pass
  - [-106.989, 39.071, elk]             # Maroon Peak area
  - [-107.720, 37.900, san-juans]       # Red Mountain Pass
  - [-106.800, 37.480, san-juans]       # Wolf Creek Pass
  - [-106.620, 40.380, northern]        # Rabbit Ears Pass
  - [-105.870, 40.520, northern]        # Cameron Pass
