# Lift-served context: route candidates within these distances of operating
# downhill ski areas or lifts are counted as resort terrain, not backcountry.
# Abandoned ski areas (for example Berthoud Pass) do not count.
resort_context:
  polygon_buffer_m: 500
  point_buffer_m: 3000
  point_statuses: [operating, proposed]
  lift_buffer_m: 1000
  lift_exclude_values: [pylon, station, goods, zip_line]

# Plausible elevation range for Colorado features; source values outside it
# are kept as eleRaw and elevationM is left null.
elevation_range_m: [1000, 4410]
metric_crs: "EPSG:26913"

# Product descriptions copied into each *.meta.json.
products:
  routes:
    id: routes
    title: Colorado ski routes (descents, skin/tour routes, winter approaches, touring areas)
    license: "ODbL-1.0 (derived database of OpenStreetMap; share-alike applies to the data)"
    attribution: "(c) OpenStreetMap contributors (ODbL); USDA Forest Service; elevation © Mapterhorn"
    sources: [osm, usfs_trails, openskidata, dem]
    steps:
      - "OSM ways with piste:type, ski/ski:nordic/snowshoe access tags, or membership in route=piste/ski relations (relation piste tags fill ways that lack their own)."
      - "Tag rules in classify.py assign ski_descent, ascent_skin, approach or touring_area; every feature carries classBasis. Ways without a winter or ski tag are never included."
      - "Candidates inside lift-served context (within 500 m of an operating downhill ski-area polygon, 3 km of an operating or proposed ski-area point without polygon, or 1 km of a lift) are excluded and counted; abandoned ski areas do not count as lift-served."
      - "USFS TrailNFS segments with nonmotorized winter use (snowshoe or cross-country ski allowed or managed) added as approach."
      - "Geometry simplified with Douglas-Peucker (ST_SimplifyPreserveTopology) at the configured tolerance; coordinates rounded."
      - "lengthM is the geodesic length of the unsimplified source geometry. dem* fields sample the Mapterhorn DEM (z13) along the unsimplified line at 7.5 m spacing; aspect is degrees clockwise from true north (Web Mercator grid north is true north)."
      - "OpenSkiData runs were used only as a cross-check of OSM ski-touring counts (same OSM origin, unstable ids); they are not duplicated here."
    units: {lengthM: metres, demGainM: metres, demLossM: metres, demMinElevM: "metres (Mapterhorn; NAVD88 where the source is USGS 3DEP)", demMaxElevM: metres, demMeanAspectDeg: "degrees clockwise from true north, downslope direction", demAspectResultant: "0..1 circular resultant length (1 = all samples share one aspect)"}
    limitations:
      - "OSM tags do not say whether a ski-touring way is the up track or the descent. ascent_skin is the default for undirected tour routes; ski_descent is used for downhill pistes outside lift-served context and for tour ways whose source name names a descent feature (couloir, face, chute, bowl, gully, glade). See classBasis."
      - "approach means a source tag records winter or ski use on that way. It does not mean the route is open, plowed, signed, legal to park at, or safe."
      - "Route presence or absence says nothing about avalanche hazard. DEM metrics describe terrain shape only."
      - "Coverage is sparse and uneven; see docs/coverage-routes.md. Absence of a line is not absence of a route."
      - "DEM metrics come from Mapterhorn z13 tiles (512 px, about 7.4 m pixels at 39 N), built from USGS 3DEP 1 m where available, 3DEP 1/3 arc-second and Copernicus GLO-30; which source fills a given tile is not stated. docs/sources/map-routes.md section 5.5 measured Mapterhorn minus current 3DEP RMSE 1.4 to 1.9 m near Berthoud Pass. Gain and loss are raw sums of sampled steps without smoothing, so they include DEM noise; short lines and sharp features are smoothed by bilinear sampling."
  ski_areas:
    id: ski-areas
    title: Colorado ski areas (lift-served and nordic, including abandoned)
    license: "ODbL-1.0 (derived database of OpenStreetMap; share-alike applies to the data)"
    attribution: "Data from OpenSkiData / OpenSkiMap.org, (c) OpenStreetMap contributors (ODbL), Skimap.org, Who's On First, (c) Mapterhorn"
    sources: [openskidata, osm]
    steps:
      - "OpenSkiData ski_areas export filtered to places iso3166_2 = US-CO."
      - "Features without an OpenStreetMap or Skimap.org source id are skipped because OpenSkiData's own ids are content hashes that change daily."
    limitations:
      - "Polygons come from OSM landuse=winter_sports where mapped; many ski areas are points only. Boundaries are approximate and are not permit or closure boundaries."
      - "status is OpenSkiData's (operating, abandoned, proposed, never_opened, disused); abandoned areas are former resorts and today are backcountry or private land."
  places:
    id: places
    title: Colorado peaks, passes, trailheads, trailhead parking and huts
    license: "ODbL-1.0 (derived database of OpenStreetMap; share-alike applies to the data)"
    attribution: "(c) OpenStreetMap contributors (ODbL); U.S. Geological Survey GNIS"
    sources: [osm, gnis, dem]
    steps:
      - "OSM nodes and way centroids: natural=peak, mountain_pass=yes or natural=saddle, highway=trailhead, tourism=alpine_hut or wilderness_hut or shelter_type=basic_hut, amenity=parking within the configured distance of a trailhead (access private/no/customers excluded)."
      - "Unnamed peaks and passes are skipped unless a GNIS Summit/Gap lies within the match radius, in which case the GNIS name is used (nameSource)."
      - "Each OSM peak and pass is matched to the nearest GNIS Summit or Gap within the match radius (gnisId, gnisName, gnisNameMatch, gnisDistanceM). GNIS Summits and Gaps with no OSM counterpart are added with elevationM null."
      - "Huts inside lift-served context are excluded (they are on-mountain resort lodges tagged as huts)."
      - "Peaks with no source elevation get demElevationM, a bilinear Mapterhorn z13 sample at the point. elevationM stays the source value and stays null when the source has none."
    units: {elevationM: "metres (source ele tag)", demElevationM: "metres (Mapterhorn z13 bilinear sample; NAVD88 where the source is USGS 3DEP)", gnisDistanceM: metres}
    limitations:
      - "elevationM is the source ele tag; values outside the plausible Colorado range are not converted and are kept only as eleRaw. The current GNIS Domestic Names release carries no elevations."
      - "demElevationM (peaks without a source elevation only) is a terrain-model sample at the mapped point, not a surveyed summit height. It is usually a few metres low on sharp summits, and more where the point is misplaced."
      - "Trailheads and parking are not winter-access claims: plowing, seasonal closures, fees and legal parking are unknown."
      - "OSM parking mapped as multipolygon relations is not included."
  regions:
    id: regions
    title: App-defined Colorado reporting regions
    license: Project-authored polygons; no third-party data
    attribution: Skintrack CO
    sources: []
    steps:
      - "Hand-drawn approximate polygons from named landmarks (config.yaml), applied in priority order; each published polygon is its configured polygon minus higher-priority regions, clipped to the Colorado bounding box. 'other' is the remainder."
    limitations:
      - "These are app-defined approximations for reporting and filtering only. They are not official, land-management or CAIC forecast-zone boundaries, and must not be used to choose a forecast."
      - "The Colorado outline is approximated by its bounding box."
  land:
    id: land-status
    script: pipeline/routes/land.py
    title: Colorado land manager (surface management agency), simplified
    license: Public domain (BLM SMA)
    attribution: "Bureau of Land Management, Surface Management Agency (SMA)"
    sources: [blm_sma]
    steps:
      - "BLM SMA limited-scale layer queried for ADMIN_ST = CO, private and unknown excluded (no polygon means private or unknown), server-side generalisation at max_allowable_offset_deg."
      - "ST_MakeValid repairs self-intersections introduced by generalisation (polygonal parts kept); coordinates rounded; one feature per managing agency."
    limitations:
      - "Managing agency is not current access, legal parking, closure status or permission to cross. Private inholdings smaller than the generalisation tolerance are not visible; boundaries are approximate (about 30 m)."
      - "State land (ST) includes State Land Board trust land, much of which is closed to public recreation without a lease or permit."
      - "SMA describes surface administrative jurisdiction, not ownership detail (per BLM)."
  search:
    id: search
    title: Place and route search index
    license: "ODbL-1.0 (derived database of OpenStreetMap; share-alike applies to the data)"
    attribution: "(c) OpenStreetMap contributors (ODbL); OpenSkiData / OpenSkiMap.org, Skimap.org; USDA Forest Service; U.S. Geological Survey GNIS"
    format: JSON (columnar fields + rows)
    sources: [osm, gnis, openskidata, usfs_trails]
    steps:
      - "Every named feature from places, ski-areas and routes; lon/lat is the label point (point on surface for lines and polygons)."
    limitations:
      - "Names are as published by each source; duplicates across sources (for example an OSM trail and the USFS segment of the same trail) are not merged."
